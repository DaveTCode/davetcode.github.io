baseurl = "https://blog.davetcode.co.uk/"
title = "David Tyler's Blog"

theme = "PaperMod"
enableEmoji = true
enableRobotsTXT = true
disableKinds = ["taxonomy"]
copyright = "David Tyler"

locale = "en-GB"
defaultContentLanguage = "en"

summaryLength = 100 # Custom summary length, add <!--more--> in post file to custom split point

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[permalinks]
  post = "/:section/:filename/" # Custom post links, e.g. "/:year/:month/:title/"

[params]
  author = "David Tyler"
  description = "A coding blog specifically covering topics relating to emulation."
  images = ["/space-invaders/images/space_invaders.png"]
  defaultTheme = "auto"
  ShowWordCount = true
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  disableSpecial1stPost = true
  showLicense = true
  showToc = true

  # Posts shown in homepage
  mainSections = ["post"]

  # License
  license = "CC BY-NC-SA 4.0"
  licenseLink = "https://creativecommons.org/licenses/by-nc-sa/4.0/"

  [params.assets]
    disableHLJS = true
    theme_color = "#ffffff"
    msapplication_TileColor = "#2b5797"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    style = "monokai"
    tabWidth = 4

  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6

[taxonomies]
  tag = "tags"

[menus]
  [[menus.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 2

  [[menus.main]]
    name = "Search"
    url = "/search/"
    weight = 3
  [[menus.main]]
    name = "GitHub"
    url = "https://github.com/davetcode"
    weight = 4
  [[menus.main]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/datyler/"
    weight = 5
